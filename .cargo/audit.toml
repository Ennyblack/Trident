    # Triaged 2026-08-30 (#373).
    { id = "RUSTSEC-2023-0071", reason = "Transitive dep; no RSA private-key ops in our code. Unreachable path. Triaged 2026-08-30 (#373)." },

    # RUSTSEC-2026-0049: pre-existing advisory in transitive dependency.
